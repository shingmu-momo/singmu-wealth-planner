        calculateAndRender();
    };

    // 自訂 Toast 通知
    function showCustomAlert(message, duration = 3000) {
        const toast = document.getElementById('custom-toast');
        toast.innerText = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), duration);
    }

    // 金額格式化
    function formatCurrency(amount) {
        return 'NT$ ' + Math.round(amount).toLocaleString('en-US');
    }

    // 設定所有輸入框的監聽事件
    function setupEventListeners() {
        document.querySelectorAll('input[type="number"]').forEach(input => {
            input.addEventListener('input', () => triggerRecalculation());
        });
    }

    // 觸發重新計算
    function triggerRecalculation(animate = false) {
        const container = document.getElementById('results-container');
        if (animate) {
            container.classList.add('recalculating');
            setTimeout(() => {
                calculateAndRender();
                container.classList.remove('recalculating');
            }, 400);
        } else {
            calculateAndRender();
        }
    }

    // 重置推演
    function resetSimulation() {
        document.getElementById('global-years').value    = DEFAULT_PARAMS.global.years;
        document.getElementById('global-inflation').value = DEFAULT_PARAMS.global.inflation;

        PLANS.forEach(plan => {
            document.getElementById(`plan-${plan.id}-monthly`).value   = DEFAULT_PARAMS[plan.id].monthly;
            document.getElementById(`plan-${plan.id}-payYears`).value  = DEFAULT_PARAMS[plan.id].payYears;
            document.getElementById(`plan-${plan.id}-irr`).value       = DEFAULT_PARAMS[plan.id].irr;
        });

        triggerRecalculation(true);
        showCustomAlert('參數已重置完畢');
    }

    // 核心計算與渲染
    function calculateAndRender() {
        const totalYears    = parseInt(document.getElementById('global-years').value)     || 0;
        const inflationRate = parseFloat(document.getElementById('global-inflation').value) / 100 || 0;

        document.getElementById('summary-years').innerText = totalYears;

        const chartData = {
            labels: Array.from({ length: totalYears }, (_, i) => `第 ${i + 1} 年`),
            datasets: []
        };

        const summaryData = [];
        let maxChartValue = 0;

        PLANS.forEach(plan => {
            const monthly = parseFloat(document.getElementById(`plan-${plan.id}-monthly`).value) || 0;
            if (monthly <= 0) return;

            const payYears  = parseInt(document.getElementById(`plan-${plan.id}-payYears`).value) || 0;
            const irr       = parseFloat(document.getElementById(`plan-${plan.id}-irr`).value) / 100 || 0;
            const annualAmt = monthly * 12;

            let currentNominalVal = 0;
            const trajectoryReal  = [];
            let totalPrincipal    = 0;

            for (let y = 1; y <= totalYears; y++) {
                if (y <= payYears) {
                    // 修正版：舊資金享整年複利，新投入享半年複利
                    currentNominalVal = currentNominalVal * (1 + irr) + annualAmt * (1 + irr * 0.5);
                    totalPrincipal += annualAmt;
                } else {
                    // 停扣後純滾利
                    currentNominalVal = currentNominalVal * (1 + irr);
                }

                const currentRealVal = currentNominalVal / Math.pow(1 + inflationRate, y);
                trajectoryReal.push(currentRealVal);
                if (currentRealVal > maxChartValue) maxChartValue = currentRealVal;
            }

            chartData.datasets.push({
                label:           plan.name,
                data:            trajectoryReal,
                borderColor:     plan.color,
                backgroundColor: plan.bgAlpha,
                borderWidth:     2,
                borderDash:      plan.isDashed ? [5, 5] : [],
                fill:            !plan.isDashed,
                pointRadius:     0,
                pointHoverRadius: 6,
                tension:         0.4
            });

            // 修正：顯示的繳費年期不超過推演總年期
            const displayPayYears = Math.min(payYears, totalYears);

            summaryData.push({
                name:           plan.name,
                color:          plan.color,
                payYears:       displayPayYears,
                totalPrincipal: totalPrincipal,
                finalNominal:   currentNominalVal,
                finalReal:      trajectoryReal[totalYears - 1] || 0
            });
        });

        renderSummaryCards(summaryData);
        renderChart(chartData, maxChartValue);
    }

    // 渲染摘要卡片
    function renderSummaryCards(data) {
        const container = document.getElementById('summary-cards');
        container.innerHTML = '';

        if (data.length === 0) {
            container.innerHTML = '<div class="col-span-full text-center py-6 text-gray-500">尚無有效方案（請設定月投入金額大於 0）</div>';
            return;
        }

        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'bg-white rounded-xl shadow-sm border p-4 relative overflow-hidden';
            card.style.borderTopWidth = '4px';
            card.style.borderTopColor = item.color;

            card.innerHTML = `
                <h3 class="font-bold text-gray-800 text-lg mb-2">${item.name}</h3>
                <div class="space-y-3">
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-500">繳費年期</span>
                        <span class="font-medium text-gray-700">${item.payYears} 年</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-500">總投入本金</span>
                        <span class="font-medium text-gray-700">${formatCurrency(item.totalPrincipal)}</span>
                    </div>
                    <div class="pt-2 border-t border-gray-100">
                        <div class="text-xs text-gray-400 mb-1">帳面數字 (名目)</div>
                        <div class="text-sm font-medium text-gray-500 line-through decoration-gray-300">${formatCurrency(item.finalNominal)}</div>
                    </div>
                    <div class="bg-gray-50 p-2 rounded-lg mt-1">
                        <div class="text-xs font-semibold" style="color:${item.color}">實質購買力</div>
                        <div class="text-xl font-bold text-gray-900">${formatCurrency(item.finalReal)}</div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // 繪製或更新 Chart.js（相容 v4）
    function renderChart(chartData, maxValue) {
        const ctx = document.getElementById('simulationChart').getContext('2d');
        const useTenThousand = maxValue > 5000000;

        if (simChart) {
            simChart.destroy();
        }

        simChart = new Chart(ctx, {
            type: 'line',
            data: chartData,
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                plugins: {
                    legend: {
                        position: 'top',
                        labels: {
                            usePointStyle: true,
                            padding: 20,
                            font: { family: "'PingFang TC', 'Microsoft JhengHei', sans-serif" }
                        }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(17, 24, 39, 0.9)',
                        titleFont: { size: 14, family: "'PingFang TC', 'Microsoft JhengHei', sans-serif" },
                        bodyFont:  { size: 13, family: "'PingFang TC', 'Microsoft JhengHei', sans-serif" },
                        padding: 12,
                        callbacks: {
                            label: function(context) {
                                return context.dataset.label + ': ' + formatCurrency(context.parsed.y);
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        grid:   { color: '#e5e7eb' },
                        border: { display: false }
                    },
                    y: {
                        grid:   { color: '#e5e7eb' },
                        border: { display: false },
                        ticks: {
                            callback: function(value) {
                                if (useTenThousand) {
                                    return (value / 10000).toLocaleString() + ' 萬';
                                }
                                return value.toLocaleString();
                            }
                        }
                    }
                }
            }
        });
    }

    // 匯出 PDF（先將 canvas 轉圖片，避免版面跑掉）
    function exportToPDF() {
        showCustomAlert('PDF 匯出中，請稍候...');

        const canvas  = document.getElementById('simulationChart');
        const chartImg = document.createElement('img');
        chartImg.src = simChart ? simChart.toBase64Image('image/png', 1.0) : '';
        chartImg.style.width       = '100%';
        chartImg.style.height      = '450px';
        chartImg.style.objectFit   = 'contain';

        // 暫時替換 canvas 為靜態圖片
        canvas.parentNode.replaceChild(chartImg, canvas);

        const opt = {
            margin:      [8, 8, 8, 8],
            filename:    '財富增值與實質購買力推演報告.pdf',
            image:       { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true, logging: false, allowTaint: true },
            jsPDF:       { unit: 'mm', format: 'a4', orientation: 'landscape' },
            pagebreak:   { mode: ['avoid-all', 'css', 'legacy'] }
        };

        // 截圖前關掉 toast，避免被拍進 PDF
        document.getElementById('custom-toast').classList.remove('show');

        html2pdf().set(opt).from(document.getElementById('app-container')).save().then(() => {
            chartImg.parentNode.replaceChild(canvas, chartImg);
            showCustomAlert('PDF 匯出完成！');
        }).catch(err => {
            chartImg.parentNode.replaceChild(canvas, chartImg);
            console.error(err);
            showCustomAlert('匯出失敗，請檢查主控台錯誤。');
        });
    }
</script>
